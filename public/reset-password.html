<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Trust</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="shortcut icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site-shared.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .reset-box {
    width: 100%; max-width: 400px;
    background: var(--dark); border: 1px solid var(--border);
    padding: 40px;
  }
  .reset-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .reset-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px; font-weight: 800; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .reset-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .form-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .form-input {
    background: #111; border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; font-family: 'Barlow', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.2s; width: 100%;
  }
  .form-input:focus { border-color: var(--red); }
  .msg { font-size: 12px; padding: 10px 12px; margin-bottom: 16px; display: none; line-height: 1.5; }
  .msg.error { display: block; background: rgba(193,18,31,0.12); color: var(--red-light); border: 1px solid rgba(193,18,31,0.3); }
  .msg.success { display: block; background: rgba(34,197,94,0.1); color: #22C55E; border: 1px solid rgba(34,197,94,0.3); }
</style>
</head>
<body>

<div class="reset-box">
  <div class="reset-logo">
    <img src="/assets/logo-icon.png" alt="Trust logo" style="height:30px;width:auto">
    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:1px;text-transform:uppercase">Trust</span>
  </div>

  <div id="resetFormWrap">
    <h1 class="reset-title">Reset Password</h1>
    <p class="reset-sub">Choose a new password for your account.</p>
    <p class="msg" id="resetMsg"></p>
    <form id="resetForm" onsubmit="return handleReset(event)">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input class="form-input" type="password" id="newPassword" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-input" type="password" id="confirmPassword" required minlength="8" placeholder="Re-enter your new password">
      </div>
      <button class="btn-full" type="submit" id="resetBtn" style="width:100%">Reset Password</button>
    </form>
  </div>

  <div id="resetSuccess" style="display:none">
    <h1 class="reset-title">Password Updated</h1>
    <p class="reset-sub">Your password has been reset. You can log in with it now.</p>
    <a class="btn-full" href="/index.html" style="width:100%;box-sizing:border-box;text-align:center;text-decoration:none;display:block">Back to Home</a>
  </div>

  <div id="resetInvalid" style="display:none">
    <h1 class="reset-title">Link Missing</h1>
    <p class="reset-sub">This page needs a reset link from your email — please use the link we sent you, or request a new one from the site.</p>
    <a class="btn-full" href="/index.html" style="width:100%;box-sizing:border-box;text-align:center;text-decoration:none;display:block">Back to Home</a>
  </div>
</div>

<script>
  const API_BASE = window.location.origin;
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('resetFormWrap').style.display = 'none';
    document.getElementById('resetInvalid').style.display = 'block';
  }

  function showMsg(message, type) {
    const el = document.getElementById('resetMsg');
    el.textContent = message;
    el.className = `msg ${type}`;
  }

  async function handleReset(event) {
    event.preventDefault();
    const btn = document.getElementById('resetBtn');
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (password !== confirm) {
      showMsg("Passwords don't match.", 'error');
      return false;
    }

    btn.disabled = true; btn.textContent = 'Resetting…';
    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');

      document.getElementById('resetFormWrap').style.display = 'none';
      document.getElementById('resetSuccess').style.display = 'block';
    } catch (err) {
      showMsg(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Reset Password';
    }
    return false;
  }
</script>
</body>
</html>
